services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A worker.app worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      # Forwarded from the host shell/.env - the coaching LLM call needs this.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    
  frontend:
    build: ./mobile/ML-Rock-Climbing-App
    restart: unless-stopped
    command: sh -c "npm ls --depth=0 >/dev/null 2>&1 || npm ci; exec npx expo start --host lan"
    # Without a TTY, Expo CLI can't tell it's running interactively and drops
    # its whole Expo Go connection banner - the QR code and exp:// URL never
    # print, just a plain "Waiting on http://localhost:8081" line for web.
    tty: true
    stdin_open: true
    ports:
      - "8081:8081"
    environment:
      # Metro auto-detects the LAN IP to advertise to devices, but inside this
      # container the only interface it sees is Docker's internal bridge IP,
      # not your Windows machine's real Wi-Fi/Ethernet address. That wrong IP
      # ends up in Constants.expoConfig.hostUri and breaks every API call from
      # a physical phone. This overrides the auto-detection with the real one.
      # Sourced from .env (HOST_LAN_IP) instead of hardcoded here so switching
      # networks never means editing this file - run
      # scripts/refresh-lan-ip.ps1 to detect the current IP, write it to
      # .env, and recreate this container (no image rebuild needed).
      REACT_NATIVE_PACKAGER_HOSTNAME: "${HOST_LAN_IP}"
      # expo start runs non-interactively here, so there's no TTY to run
      # `expo login` against. An access token (from expo.dev account settings
      # -> Access Tokens) authenticates the CLI instead, matching whatever
      # account Expo Go on your phone is signed into.
      EXPO_TOKEN: ${EXPO_TOKEN}
    volumes:
      - ./mobile/ML-Rock-Climbing-App:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  redis-data:
