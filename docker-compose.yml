services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A worker.app worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    
  frontend:
    build: ./mobile/ML-Rock-Climbing-App
    restart: unless-stopped
    command: npx expo start --host lan
    ports:
      - "8081:8081"
    environment:
      # Metro auto-detects the LAN IP to advertise to devices, but inside this
      # container the only interface it sees is Docker's internal bridge IP,
      # not your Windows machine's real Wi-Fi/Ethernet address. That wrong IP
      # ends up in Constants.expoConfig.hostUri and breaks every API call from
      # a physical phone. This overrides the auto-detection with the real one.
      # Update this if you switch networks or your machine's IP changes.
      REACT_NATIVE_PACKAGER_HOSTNAME: "192.168.1.71"
    volumes:
      - ./mobile/ML-Rock-Climbing-App:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  redis-data:
