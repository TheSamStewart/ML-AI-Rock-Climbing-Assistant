name: Load Test (backend)

# Manual/scheduled only - NOT run on every PR. A GitHub-hosted runner (2
# vCPU) can't honestly generate 10,000 concurrent connections; this exists
# as a smoke-scale regression signal (default 200 concurrent virtual users),
# not a validated "handles 10,000 users" gate. See backend/Agents.md
# section 4 for the full reasoning and how to run this at a real scale
# against staging.

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Concurrent virtual users"
        required: false
        default: "200"
      duration:
        description: "Seconds to run after ramp-up"
        required: false
        default: "60"
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Start API stack (redis, api, worker)
        run: docker compose up -d redis api worker

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/analysis/readiness-probe > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Run load test
        working-directory: backend
        run: |
          uv run python load_test/simulate_load.py \
            --base-url http://localhost:8000 \
            --users "${{ inputs.users || '200' }}" \
            --duration "${{ inputs.duration || '60' }}" \
            --ramp-up 10 \
            --csv load_test_results.csv

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: backend/load_test_results.csv
          retention-days: 30

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
