name: Load Test (backend)

# Manual-only - NOT run on every PR, and NOT on a schedule. A GitHub-hosted
# runner (2 vCPU) running the whole stack (redis + a single-process,
# --reload dev uvicorn + an unconfigured-concurrency Celery worker) alongside
# the load generator itself isn't a realistic target - most of what it
# measures is the runner's own resource contention, not the app. A prior
# scheduled run against this setup showed ~78% of requests timing out at the
# client's own 10s timeout, which is a runner-capacity artifact, not a
# regression signal worth alerting on weekly. Re-enable a schedule (or just
# run this manually) once there's a real host - e.g. a VPS - to point
# --base-url at, where the numbers reflect the app instead of the CI runner.
# See backend/Agents.md section 4 for the full reasoning.

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Concurrent virtual users"
        required: false
        default: "200"
      duration:
        description: "Seconds to run after ramp-up"
        required: false
        default: "60"

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Start API stack (redis, api, worker)
        run: docker compose up -d redis api worker

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/analysis/readiness-probe > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs
          exit 1

      - name: Run load test
        working-directory: backend
        run: |
          uv run python load_test/simulate_load.py \
            --base-url http://localhost:8000 \
            --users "${{ inputs.users || '200' }}" \
            --duration "${{ inputs.duration || '60' }}" \
            --ramp-up 10 \
            --csv load_test_results.csv

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: backend/load_test_results.csv
          retention-days: 30

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
