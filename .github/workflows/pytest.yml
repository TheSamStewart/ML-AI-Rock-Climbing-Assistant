name: Run Pytest with uv

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.14' 

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Run Pytest
        working-directory: backend
        # python -m pytest (not the `pytest` script) so this matches how the
        # suite is run in local dev, where some environments block spawning
        # venv .exe entry points directly.
        run: uv run python -m pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 14